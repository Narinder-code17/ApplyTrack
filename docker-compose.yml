services:
  db:
    image: postgres:18
    container_name: applytrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - applytrack-postgres-data:/var/lib/postgresql
    networks:
      - applytrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d applytrack_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: applytrack-backend:latest
    container_name: applytrack-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "8082:8081"
    networks:
      - applytrack-network

  frontend:
    image: applytrack-frontend:latest
    container_name: applytrack-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    networks:
      - applytrack-network

volumes:
  applytrack-postgres-data:

networks:
  applytrack-network:
    driver: bridge